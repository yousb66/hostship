name: Host-Ship Auto Renew

on:
  schedule:
    # 每 5 天一次，UTC 13:30 = 北京时间 21:30
    - cron: '30 13 */5 * *'
  workflow_dispatch:

jobs:
  Renew-HostShip:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ 安装系统底层 GUI 依赖 (用于虚拟屏幕和过盾点击)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk python3-dev scrot dbus-x11

      - name: ⚙️ 设置代理 (sing-box)
        # setup_proxy.sh 在未配置 NODE_LINK 时会自行退出并写入 IS_PROXY=false，
        # 属正常情况；因此这里 continue-on-error，代理失败不应中断续期任务。
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 检查代理状态
        # 仓库是 public，Actions 日志公开可读。节点出口 IP 属于凭证级信息
        # （暴露后可直接被针对性封禁），因此这里只打印连通性结论 + 脱敏后的
        # IP 前缀，绝不输出完整地址。
        run: |
          if [ "${IS_PROXY:-false}" = "true" ]; then
            RAW_IP=$(curl -x "$PROXY_SERVER" -s --max-time 15 https://api.ipify.org || echo "")
            if [ -n "$RAW_IP" ]; then
              # 同时注册为掩码，防止后续任何步骤意外回显完整 IP
              echo "::add-mask::$RAW_IP"
              MASKED=$(printf '%s' "$RAW_IP" | awk -F. 'NF==4{print $1"."$2".x.x"} NF!=4{print "x.x.x.x"}')
              echo "✅ 代理已启用，出口IP：$MASKED（已脱敏）"
            else
              echo "⚠️ 代理已启用，但出口 IP 探测失败"
            fi
          else
            echo "ℹ️ 未配置 NODE_LINK 或代理启动失败，使用直连模式"
          fi

      - name: 🛠️ 安装 Python 运行库
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests pyautogui

      - name: 🚀 运行续期脚本
        # 注意：不要在这里重新声明 PROXY_SERVER / IS_PROXY。
        # setup_proxy.sh 通过 $GITHUB_ENV 写出的变量会自动进入后续步骤的
        # shell 环境，hostship_run.py 用 os.getenv 读取即可；若在此用
        # ${{ env.PROXY_SERVER }} 声明，该表达式取不到 GITHUB_ENV 的值，
        # 会写入空串反而把继承来的值覆盖掉。
        env:
          HOSTSHIP_EMAIL: ${{ secrets.HOSTSHIP_EMAIL }}
          HOSTSHIP_PASSWORD: ${{ secrets.HOSTSHIP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${IS_PROXY:-false}" = "true" ]; then
            echo "🌐 本次运行使用代理: ${PROXY_SERVER}"
          else
            echo "ℹ️ 本次运行直连"
          fi
          # 使用 xvfb-run 启动，模拟带显示器的环境
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 hostship_run.py

      - name: 收集过程截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostship-screenshots
          path: '*.png'
          if-no-files-found: ignore
